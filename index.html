<style>
:root {
  color-scheme: light;
  --bg: #FFFFFF;
  --ink: #151A21;
  --muted: #58626E;
  --line: #E1E4E8;
  --accent: #1B4F80;
  --accent-ink: #FFFFFF;
  --note: #EEF3F8;
  --panel: #F5F6F8;
  --font: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0F1318;
    --ink: #E8ECF1;
    --muted: #9BA6B2;
    --line: #262F39;
    --accent: #7FB3E6;
    --accent-ink: #0F1318;
    --note: #16202B;
    --panel: #151B22;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.65;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
img { max-width: 100%; display: block; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1, h2, h3, p, ul, dl, dd { margin: 0; }
ul { padding: 0; list-style: none; }

/* ---------- Layout ---------- */
.layout { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 330px minmax(0, 1fr); }
.rail {
  position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
  padding: 48px 32px 40px; border-right: 1px solid var(--line);
}
.main { padding: 48px 56px 72px; }
.main-inner { max-width: 820px; }
@media (max-width: 900px) {
  .layout { display: block; }
  .rail { position: static; height: auto; overflow: visible; padding: 32px 22px 28px; border-right: 0; border-bottom: 1px solid var(--line); }
  .main { padding: 32px 22px 56px; }
}

/* ---------- Rail ---------- */
.portrait { width: 128px; aspect-ratio: 4 / 5; overflow: hidden; border-radius: 3px; background: var(--panel); margin-bottom: 22px; }
.portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.name { font-size: 1.7rem; line-height: 1.15; font-weight: 600; letter-spacing: -.015em; }
.role { margin-top: 8px; font-weight: 500; }
.meta { margin-top: 4px; color: var(--muted); font-size: .9375rem; }
.credential { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: .9375rem; }
.credential strong { font-weight: 600; }
.credential span { display: block; color: var(--muted); }
.contact-list { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: .9375rem; overflow-wrap: anywhere; }
.contact-list a { color: var(--ink); text-decoration-color: var(--line); }
.contact-list a:hover { color: var(--accent); text-decoration-color: currentColor; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; margin-top: 20px;
  border-radius: 4px; font: 500 .9375rem/1 var(--font); text-decoration: none; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent);
}
.btn:hover { filter: brightness(1.08); }
.btn.secondary { background: transparent; color: var(--ink); border-color: var(--line); margin-top: 0; }
.btn.secondary:hover { border-color: var(--muted); filter: none; }
.toc { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 2px; font-size: .9375rem; }
.toc a { color: var(--muted); text-decoration: none; padding: 5px 0; }
.toc a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
@media (max-width: 900px) {
  .toc { display: flex; flex-wrap: wrap; gap: 4px 18px; }
}

/* ---------- Sections ---------- */
section { scroll-margin-top: 28px; }
section + section { margin-top: 48px; padding-top: 36px; border-top: 1px solid var(--line); }
h2 { font-size: 1.35rem; line-height: 1.25; font-weight: 600; letter-spacing: -.01em; margin-bottom: 20px; }
.summary { font-size: 1.2rem; line-height: 1.6; max-width: 36em; text-wrap: pretty; }
.glance { margin-top: 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.glance > div { display: flex; flex-direction: column-reverse; padding: 16px 16px 16px 0; }
.glance > div + div { padding-left: 16px; border-left: 1px solid var(--line); }
.glance dd { font-size: 1.6rem; line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; }
.glance dt { margin-top: 6px; color: var(--muted); font-size: .875rem; line-height: 1.35; }
@media (max-width: 560px) { .glance { grid-template-columns: 1fr; } .glance > div, .glance > div + div { padding: 12px 0; border-left: 0; } .glance > div + div { border-top: 1px solid var(--line); } }

/* ---------- Projects ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: -6px 0 6px; }
.filters button {
  min-height: 40px; padding: 0; border: 0; background: none; color: var(--muted); cursor: pointer;
  font: 500 .9375rem/1 var(--font); box-shadow: inset 0 -2px 0 transparent;
}
.filters button:hover { color: var(--ink); }
.filters button[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.proj { border-top: 1px solid var(--line); }
.proj:first-child { border-top: 0; }
.proj[hidden] { display: none; }
.proj-btn {
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 22px; align-items: start;
  width: 100%; padding: 22px 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.proj-btn.no-shot { grid-template-columns: minmax(0, 1fr); }
.shot { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; border: 1px solid var(--line); border-radius: 2px; background: var(--panel); }
.proj-text { display: grid; gap: 6px; }
.p-cat { color: var(--muted); font-size: .875rem; }
.p-title { font-size: 1.15rem; line-height: 1.3; font-weight: 600; letter-spacing: -.005em; }
.p-sum { color: var(--ink); opacity: .86; }
.p-tools { color: var(--muted); font-size: .9rem; }
.proj-btn:hover .p-title { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
.proj.featured .proj-btn { grid-template-columns: minmax(0, 1fr); gap: 18px; }
.proj.featured .shot { aspect-ratio: 16 / 8; }
.proj.featured .p-title { font-size: 1.45rem; }
.proj.featured .p-sum { font-size: 1.05rem; }
.empty { padding: 28px 0; color: var(--muted); }
.empty[hidden] { display: none; }
@media (max-width: 640px) { .proj-btn { grid-template-columns: minmax(0, 1fr); gap: 14px; } }

/* ---------- Modal ---------- */
dialog {
  width: min(960px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); padding: 0; overflow: auto;
  border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
}
dialog::backdrop { background: rgba(10, 14, 19, .6); }
dialog[open] { animation: open .2s ease-out; }
@keyframes open { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.modal-media { position: relative; background: var(--panel); border-bottom: 1px solid var(--line); }
.modal-media[hidden] { display: none; }
.modal-media .frame { aspect-ratio: 16 / 9; overflow: hidden; }
.modal-media img { width: 100%; height: 100%; object-fit: contain; transition: opacity .2s; }
.gal-btn {
  position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; display: grid; place-items: center;
}
.gal-btn.prev { left: 12px; } .gal-btn.next { right: 12px; }
.gal-count { position: absolute; bottom: 10px; right: 12px; font-size: .8125rem; padding: 3px 9px; border-radius: 3px; background: var(--bg); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.modal-body { padding: 26px 30px 30px; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 32px; }
@media (max-width: 720px) { .modal-body { grid-template-columns: 1fr; padding: 22px; gap: 22px; } }
.modal-body h2 { font-size: 1.6rem; line-height: 1.2; margin: 4px 0 10px; }
.modal-body ul { margin-top: 16px; padding-left: 20px; list-style: disc; }
.modal-body li { margin-bottom: 7px; padding-left: 2px; }
.modal-cat { color: var(--muted); font-size: .875rem; }
.modal-side h3 { font-size: .9375rem; font-weight: 600; margin-bottom: 6px; }
.modal-side .tools-line { color: var(--muted); font-size: .9375rem; margin-bottom: 22px; }
.modal-links { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.note {
  margin-top: 20px; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--note);
  font-size: .9375rem; line-height: 1.55; border-radius: 0 3px 3px 0;
}
.note[hidden] { display: none; }
.close {
  position: absolute; top: 12px; right: 12px; z-index: 2; width: 44px; height: 44px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; display: grid; place-items: center;
}

/* ---------- Experience ---------- */
.job + .job { margin-top: 30px; padding-top: 26px; border-top: 1px solid var(--line); }
.job-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 20px; }
.job h3 { font-size: 1.1rem; font-weight: 600; }
.when { color: var(--muted); font-size: .9375rem; font-variant-numeric: tabular-nums; }
.company { color: var(--muted); }
.job ul { margin-top: 12px; padding-left: 20px; list-style: disc; }
.job li { margin-bottom: 6px; padding-left: 2px; }

/* ---------- Skills ---------- */
.skills { display: grid; }
.skills > div { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 4px 20px; padding: 14px 0; border-top: 1px solid var(--line); }
.skills > div:first-child { border-top: 0; padding-top: 0; }
.skills dt { font-weight: 600; }
.skills dd { color: var(--ink); opacity: .88; }
@media (max-width: 620px) { .skills > div { grid-template-columns: 1fr; } }

/* ---------- Certifications ---------- */
.rows > div { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.rows > div:first-child { border-top: 0; padding-top: 0; }
.rows strong { font-weight: 600; }
.rows .sub { display: block; color: var(--muted); font-size: .9375rem; }
.rows .when { white-space: nowrap; }
.edu-block { margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--line); }
.edu-block h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 14px; }

/* ---------- Contact (mobile only; desktop uses the rail) ---------- */
#contact .contact-list { margin-top: 0; padding-top: 0; border-top: 0; font-size: 1rem; }
@media (min-width: 901px) { #contact { display: none; } }

.foot { margin-top: 56px; color: var(--muted); font-size: .875rem; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  dialog[open] { animation: none; }
  .modal-media img { transition: none; }
}
@media print {
  .layout { display: block; }
  .rail { position: static; height: auto; border: 0; padding: 0 0 20px; }
  .toc, .filters, dialog, .btn { display: none; }
  .main { padding: 0; }
}
</style>

<script src="data.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const plainUrl = (u) => String(u || "").replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
  const joined = (arr) => (arr || []).map(esc).join(", ");
  const arrow = {
    left: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
    right: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>'
  };

  /* ---------- Profile ---------- */
  document.title = `${PROFILE.name.split(" ").slice(0, 2).join(" ")} | ${PROFILE.role}`;
  $("name").textContent = PROFILE.name;
  $("role").textContent = PROFILE.role;
  $("location").textContent = PROFILE.location || "";
  $("openTo").textContent = PROFILE.openTo || "";
  $("summary").textContent = PROFILE.summary;

  const main = CERTIFICATIONS.find((c) => c.main) || CERTIFICATIONS[0];
  $("credential").innerHTML = `<strong>${esc(main.name)}</strong><span>${esc(main.issuer)}, ${esc(main.date)}</span>`;

  const contactHTML = () => {
    const rows = [];
    if (PROFILE.email) rows.push(`<a href="mailto:${esc(PROFILE.email)}">${esc(PROFILE.email)}</a>`);
    if (PROFILE.phone) rows.push(`<a href="tel:${esc(String(PROFILE.phone).replace(/[^\d+]/g, ""))}">${esc(PROFILE.phone)}</a>`);
    if (PROFILE.linkedin) rows.push(`<a href="${esc(PROFILE.linkedin)}" target="_blank" rel="noopener">${esc(plainUrl(PROFILE.linkedin))}</a>`);
    if (PROFILE.github) rows.push(`<a href="${esc(PROFILE.github)}" target="_blank" rel="noopener">${esc(plainUrl(PROFILE.github))}</a>`);
    return rows.join("");
  };
  const resumeHTML = () => PROFILE.resume ? `<a class="btn" href="${esc(PROFILE.resume)}" download>Download resume (PDF)</a>` : "";
  $("railContact").innerHTML = $("footContact").innerHTML = contactHTML();
  $("railResume").innerHTML = $("footResume").innerHTML = resumeHTML();
  if ($("footResume").firstElementChild) $("footResume").firstElementChild.style.marginTop = "18px";

  $("glance").innerHTML = HIGHLIGHTS.map((h) =>
    `<div><dd>${esc(h.value)}${esc(h.suffix || "")}</dd><dt>${esc(h.label)}</dt></div>`
  ).join("");

  /* ---------- Projects ---------- */
  let current = "All";
  $("filters").innerHTML = PROJECT_FILTERS.map((f) =>
    `<button type="button" data-filter="${esc(f)}" aria-pressed="${f === current}">${esc(f)}</button>`
  ).join("");

  $("projectList").innerHTML = PROJECTS.map((p, i) => {
    const shot = p.images && p.images[0];
    return `<li class="proj${p.featured ? " featured" : ""}" data-cat="${esc(p.category)}">
      <button type="button" class="proj-btn${shot ? "" : " no-shot"}" data-i="${i}" aria-label="Open project: ${esc(p.title)}">
        ${shot ? `<img class="shot" src="${esc(shot)}" alt="" loading="lazy">` : ""}
        <span class="proj-text">
          <span class="p-cat">${esc(p.category)}</span>
          <span class="p-title">${esc(p.title)}</span>
          <span class="p-sum">${esc(p.summary)}</span>
          <span class="p-tools">${joined(p.tools)}</span>
        </span>
      </button>
    </li>`;
  }).join("");

  $("filters").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    current = b.dataset.filter;
    $("filters").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    let shown = 0;
    document.querySelectorAll(".proj").forEach((li) => {
      const show = current === "All" || li.dataset.cat === current;
      li.hidden = !show;
      if (show) shown++;
    });
    $("emptyMsg").hidden = shown > 0;
  });

  /* ---------- Project dialog ---------- */
  const modal = $("modal");
  let gallery = [], gi = 0;
  function showImg() {
    const img = $("modalMedia").querySelector("img");
    if (!img) return;
    img.style.opacity = 0;
    setTimeout(() => { img.src = gallery[gi]; img.style.opacity = 1; }, reduce ? 0 : 120);
    const c = $("modalMedia").querySelector(".gal-count");
    if (c) c.textContent = `${gi + 1} / ${gallery.length}`;
  }
  function openProject(i) {
    const p = PROJECTS[i];
    gallery = (p.images || []).filter(Boolean); gi = 0;
    $("modalMedia").innerHTML = gallery.length
      ? `<div class="frame"><img src="${esc(gallery[0])}" alt="${esc(p.title)} screenshot"></div>` +
        (gallery.length > 1 ? `<button class="gal-btn prev" aria-label="Previous screenshot">${arrow.left}</button><button class="gal-btn next" aria-label="Next screenshot">${arrow.right}</button><span class="gal-count">1 / ${gallery.length}</span>` : "")
      : "";
    $("modalMedia").hidden = !gallery.length;
    $("modalCat").textContent = p.category;
    $("modalTitle").textContent = p.title;
    $("modalSummary").textContent = p.summary;
    $("modalDetails").innerHTML = (p.details || []).map((d) => `<li>${esc(d)}</li>`).join("");
    $("modalNote").textContent = p.note || "";
    $("modalNote").hidden = !p.note;
    $("modalTools").innerHTML = joined(p.tools);
    const l = p.links || {}, links = [];
    if (l.live) links.push(`<a class="btn" href="${esc(l.live)}" target="_blank" rel="noopener">Open live report</a>`);
    if (l.video) links.push(`<a class="btn secondary" href="${esc(l.video)}" target="_blank" rel="noopener">Watch walkthrough</a>`);
    if (l.github) links.push(`<a class="btn secondary" href="${esc(l.github)}" target="_blank" rel="noopener">View code</a>`);
    $("modalLinks").innerHTML = links.join("");
    modal.showModal();
    modal.scrollTop = 0;
  }
  $("projectList").addEventListener("click", (e) => { const b = e.target.closest(".proj-btn"); if (b) openProject(+b.dataset.i); });
  $("modalMedia").addEventListener("click", (e) => {
    if (e.target.closest(".next")) { gi = (gi + 1) % gallery.length; showImg(); }
    if (e.target.closest(".prev")) { gi = (gi - 1 + gallery.length) % gallery.length; showImg(); }
  });
  modal.addEventListener("keydown", (e) => {
    if (gallery.length < 2) return;
    if (e.key === "ArrowRight") { gi = (gi + 1) % gallery.length; showImg(); }
    if (e.key === "ArrowLeft") { gi = (gi - 1 + gallery.length) % gallery.length; showImg(); }
  });
  $("modalClose").addEventListener("click", () => modal.close());
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.close(); });

  /* ---------- Experience ---------- */
  $("jobs").innerHTML = EXPERIENCE.map((j) => `
    <article class="job">
      <div class="job-head"><h3>${esc(j.role)}</h3><span class="when">${esc(j.period)}</span></div>
      <p class="company">${esc(j.company)}${j.place ? ", " + esc(j.place) : ""}</p>
      <ul>${(j.points || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    </article>`).join("");

  /* ---------- Skills ---------- */
  $("skillList").innerHTML = SKILLS.map((s) =>
    `<div><dt>${esc(s.group)}</dt><dd>${joined(s.items)}</dd></div>`
  ).join("");

  /* ---------- Certifications and education ---------- */
  const certRow = (c) => `<div><div><strong>${esc(c.name)}</strong><span class="sub">${esc(c.issuer)}</span></div><span class="when">${esc(c.date)}</span></div>`;
  $("certList").innerHTML = [main, ...CERTIFICATIONS.filter((c) => c !== main)].map(certRow).join("");
  $("edu").innerHTML = `<div><div><strong>${esc(EDUCATION.degree)}</strong><span class="sub">${esc(EDUCATION.school)}</span></div><span class="when">${esc(EDUCATION.period)}</span></div>`;

  $("copy").textContent = `© ${new Date().getFullYear()} ${PROFILE.name}`;
})();
</script>
</body>
</html>
